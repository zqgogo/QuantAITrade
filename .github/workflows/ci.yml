name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ledgerline/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check app tests
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ledgerline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Ledgerline/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm --workspace apps/web run lint
      - name: TypeScript check
        run: npm --workspace apps/web run typecheck
      - name: Unit tests (Vitest)
        run: npm --workspace apps/web run test
      - name: Build
        run: npm --workspace apps/web run build