[project]
name = "ledgerline-api"
version = "0.1.0"
description = "FastAPI backend for Ledgerline personal AI trading workspace."
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.5.2",
  "openai>=1.93.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "ruff>=0.6.8"
]
local-ai = [
  "FlagEmbedding>=1.3.3"
]

[tool.ruff]
line-length = 100
target-version = "py311"
